name: Ingest quarterly SEC N-PORT

on:
  push:
    branches:
      - phase4-security-intelligence
    paths:
      - scripts/ingest_nport.py
      - .github/workflows/nport.yml
  schedule:
    - cron: "41 6 5 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      archive_url:
        description: "Optional SEC N-PORT ZIP URL"
        required: false
        type: string
      quarter:
        description: "Quarter label, e.g. 2026 Q2"
        required: false
        type: string

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "latest-known"

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv venv --python 3.13 && uv pip install --python .venv/bin/python -r requirements.txt

      - name: Probe SEC EDGAR Archives
        run: |
          .venv/bin/python - <<'PY'
          import requests
          url='https://www.sec.gov/Archives/edgar/data/1557265/000092687726000030/primary_doc.xml'
          headers={'User-Agent':'us-treasury-holder-tracker Vasuki8 contact via GitHub issues'}
          r=requests.get(url,headers=headers,timeout=30)
          print('SEC_ARCHIVES_STATUS',r.status_code,'BYTES',len(r.content))
          PY

      - name: Build N-PORT Treasury cache
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
          QUARTER: ${{ inputs.quarter }}
        run: |
          ARGS=""
          if [ -n "$ARCHIVE_URL" ]; then ARGS="$ARGS --url $ARCHIVE_URL"; fi
          if [ -n "$QUARTER" ]; then ARGS="$ARGS --quarter $QUARTER"; fi
          .venv/bin/python scripts/ingest_nport.py $ARGS

      - name: Commit N-PORT cache if changed
        run: |
          if git diff --quiet -- data/nport_latest.json; then
            echo "No N-PORT cache changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nport_latest.json
          git commit -m "data: refresh quarterly SEC N-PORT Treasury cache"
          git push
