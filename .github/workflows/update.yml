name: Update Treasury holder data

on:
  push:
    branches:
      - main
      - phase8-alert-intelligence
      - phase9-holder-flow-intelligence
      - phase10-release-calendar-regimes
      - phase11-discovery-comparison
      - phase12-market-structure-workspace
      - ui-refresh-research-terminal
      - ux-v2-interactive-workspace
    paths:
      - scripts/**
      - app.js
      - phase4.js
      - phase5.js
      - phase6.js
      - phase7.js
      - phase8.js
      - phase9.js
      - phase10.js
      - phase11.js
      - phase11.css
      - phase12.js
      - phase12.css
      - ui-refresh.js
      - ui-refresh.css
      - ux-v2.js
      - ux-v2.css
      - index.html
      - styles.css
      - .github/workflows/update.yml
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: treasury-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate dashboard JavaScript
        run: |
          node --check app.js
          node --check phase4.js
          node --check phase5.js
          node --check phase6.js
          node --check phase7.js
          node --check phase8.js
          node --check phase9.js
          node --check phase10.js
          node --check phase11.js
          node --check phase12.js
          node --check ui-refresh.js
          node --check ux-v2.js

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "latest-known"

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv venv --python 3.13 && uv pip install --python .venv/bin/python -r requirements.txt

      - name: Refresh official data
        run: .venv/bin/python scripts/update_data_v12.py

      - name: Validate Phase 8 output
        run: .venv/bin/python scripts/validate_phase8_state.py

      - name: Validate Phase 9 output
        run: .venv/bin/python scripts/validate_phase9_state.py

      - name: Validate Phase 10 output
        run: .venv/bin/python scripts/validate_phase10_state.py

      - name: Validate Phase 11 output
        run: .venv/bin/python scripts/validate_phase11_state.py

      - name: Validate Phase 12 output
        run: .venv/bin/python scripts/validate_phase12_state.py

      - name: Commit updated data safely
        run: |
          if git diff --quiet -- data/dashboard.json; then
            echo "No data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          REMOTE_SHA="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          LOCAL_SHA="$(git rev-parse HEAD)"
          if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$LOCAL_SHA" ]; then
            echo "Branch advanced during refresh; regenerating on latest HEAD."
            git restore data/dashboard.json
            git pull --ff-only origin "$GITHUB_REF_NAME"
            .venv/bin/python scripts/update_data_v12.py
            .venv/bin/python scripts/validate_phase8_state.py
            .venv/bin/python scripts/validate_phase9_state.py
            .venv/bin/python scripts/validate_phase10_state.py
            .venv/bin/python scripts/validate_phase11_state.py
            .venv/bin/python scripts/validate_phase12_state.py
          fi

          if git diff --quiet -- data/dashboard.json; then
            echo "No data changes after resync."
            exit 0
          fi

          git add data/dashboard.json
          git commit -m "data: refresh Treasury holder tracker"
          git push origin HEAD:"$GITHUB_REF_NAME"
