name: Update Treasury holder data

on:
  push:
    branches:
      - main
      - phase14-long-history
    paths:
      - scripts/**
      - app.js
      - country-history.js
      - country-history-archive.js
      - country-history.css
      - all-time-history.js
      - all-time-history.css
      - maturity-wall.js
      - maturity-wall.css
      - institution-history.js
      - institution-history.css
      - index.html
      - styles.css
      - .github/workflows/update.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/**
      - app.js
      - country-history.js
      - country-history-archive.js
      - country-history.css
      - all-time-history.js
      - all-time-history.css
      - maturity-wall.js
      - maturity-wall.css
      - institution-history.js
      - institution-history.css
      - index.html
      - styles.css
      - .github/workflows/update.yml
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: treasury-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate dashboard JavaScript
        run: |
          node --check app.js
          node --check country-history.js
          node --check country-history-archive.js
          node --check all-time-history.js
          node --check maturity-wall.js
          node --check institution-history.js

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "latest-known"

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv venv --python 3.13 && uv pip install --python .venv/bin/python -r requirements.txt

      - name: Refresh official data
        run: .venv/bin/python scripts/update_data_v18.py

      - name: Validate Phase 8 output
        run: .venv/bin/python scripts/validate_phase8_state.py

      - name: Validate Phase 9 output
        run: .venv/bin/python scripts/validate_phase9_state.py

      - name: Validate Phase 10 output
        run: .venv/bin/python scripts/validate_phase10_state.py

      - name: Validate Phase 11 output
        run: .venv/bin/python scripts/validate_phase11_state.py

      - name: Validate Phase 12 output
        run: .venv/bin/python scripts/validate_phase12_state.py

      - name: Validate long country history
        run: .venv/bin/python scripts/validate_country_history.py

      - name: Validate all-time history
        run: .venv/bin/python scripts/validate_all_time_history.py

      - name: Validate Treasury maturity schedule
        run: .venv/bin/python scripts/validate_treasury_maturities.py

      - name: Validate Treasury interest schedule
        run: .venv/bin/python scripts/validate_treasury_interest.py

      - name: Validate institution holder history
        run: .venv/bin/python scripts/validate_institution_history.py

      - name: Commit updated data safely
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- data/dashboard.json; then
            echo "No data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          REMOTE_SHA="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          LOCAL_SHA="$(git rev-parse HEAD)"
          if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$LOCAL_SHA" ]; then
            echo "Branch advanced during refresh; regenerating on latest HEAD."
            git restore data/dashboard.json
            git pull --ff-only origin "$GITHUB_REF_NAME"
            .venv/bin/python scripts/update_data_v18.py
            .venv/bin/python scripts/validate_phase8_state.py
            .venv/bin/python scripts/validate_phase9_state.py
            .venv/bin/python scripts/validate_phase10_state.py
            .venv/bin/python scripts/validate_phase11_state.py
            .venv/bin/python scripts/validate_phase12_state.py
            .venv/bin/python scripts/validate_country_history.py
            .venv/bin/python scripts/validate_all_time_history.py
            .venv/bin/python scripts/validate_treasury_maturities.py
            .venv/bin/python scripts/validate_treasury_interest.py
            .venv/bin/python scripts/validate_institution_history.py
          fi

          if git diff --quiet -- data/dashboard.json; then
            echo "No data changes after resync."
            exit 0
          fi

          git add data/dashboard.json
          git commit -m "data: refresh Treasury holder tracker"
          git push origin HEAD:"$GITHUB_REF_NAME"
