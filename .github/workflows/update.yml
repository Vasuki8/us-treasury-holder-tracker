name: Update Treasury holder data

on:
  push:
    branches:
      - main
      - phase7-alert-lifecycle-security
      - phase8-release-intelligence
    paths:
      - scripts/**
      - app.js
      - phase4.js
      - phase5.js
      - phase6.js
      - phase7.js
      - phase8.js
      - index.html
      - styles.css
      - .github/workflows/update.yml
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: treasury-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate dashboard JavaScript
        run: |
          node --check app.js
          node --check phase4.js
          node --check phase5.js
          node --check phase6.js
          node --check phase7.js
          node --check phase8.js

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "latest-known"

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv venv --python 3.13 && uv pip install --python .venv/bin/python -r requirements.txt

      - name: Refresh official data
        run: .venv/bin/python scripts/update_data_v8.py

      - name: Commit updated data if changed
        run: |
          if git diff --quiet -- data/dashboard.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          git commit -m "data: refresh Treasury holder tracker"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
